<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FORMA</title>
<meta name="description" content="FORMA: سجل أكلك وتمرينك ووزنك بالعربي">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D131A" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FORMA">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
<style>
/* Layout: single-column phone app, sticky header, fixed bottom tab bar, bottom sheets for adding food */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --ink:#111A24; --muted:#5D6B7A; --line:#D8DEE5;
  --accent:#2340C8; --accent-soft:#E3E8FB; --warm:#E07A1F; --good:#1F8A5B; --track:#E2E7EE; --on-accent:#FFFFFF;
  --display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D131A; --surface:#16202B; --ink:#EAF0F6; --muted:#93A2B2; --line:#26323F;
  --accent:#7D93FF; --accent-soft:#1E2A52; --warm:#F29A45; --good:#45C08A; --track:#24303D; --on-accent:#0D131A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D131A; --surface:#16202B; --ink:#EAF0F6; --muted:#93A2B2; --line:#26323F;
  --accent:#7D93FF; --accent-soft:#1E2A52; --warm:#F29A45; --good:#45C08A; --track:#24303D; --on-accent:#0D131A; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0;direction:rtl;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.app{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(100px + env(safe-area-inset-bottom,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.18em;font-size:18px;direction:ltr}
.hright{display:flex;align-items:center;gap:8px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:600;font-variant-numeric:tabular-nums}
.streak svg{width:16px;height:16px;fill:var(--warm)}
.gear{width:36px;height:36px;padding:0;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--ink)}
.gear svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
.sub{color:var(--muted);font-size:13px}
.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;min-width:0}
.tip{background:var(--accent);color:var(--on-accent);border:0}
.tip .lbl{font-size:12px;letter-spacing:.06em;opacity:.85}
.tip p{margin:4px 0 10px;font-family:var(--display);font-size:18px;font-weight:600;line-height:1.5}
.tip button{background:color-mix(in srgb,var(--on-accent) 18%,transparent);color:var(--on-accent)}
.rings{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ring{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.ring svg{width:116px;height:116px;max-width:100%}
.macro-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.macro{background:var(--bg);border-radius:12px;padding:8px;text-align:center;font-variant-numeric:tabular-nums}
.macro b{display:block;font-family:var(--display);font-size:16px}
.macro span{font-size:12px;color:var(--muted)}
button{font-family:var(--body);font-size:14px;font-weight:600;border:0;border-radius:12px;padding:10px 14px;cursor:pointer;background:var(--accent-soft);color:var(--accent)}
button.primary{background:var(--accent);color:var(--on-accent)}
button.ghost{background:none;color:var(--muted);padding:6px 8px}
button.danger{background:color-mix(in srgb,var(--warm) 16%,transparent);color:var(--warm)}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--warm);outline-offset:2px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.wide{width:100%}
.next{display:flex;flex-direction:column;gap:10px}
.next .name{font-family:var(--display);font-size:20px;font-weight:700}
.pill{display:inline-block;font-size:12px;padding:2px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--good) 18%,transparent);color:var(--good)}
.pill.warm{background:color-mix(in srgb,var(--warm) 18%,transparent);color:var(--warm)}
input[type=search],input[type=number],input[type=text]{font-family:var(--body);font-size:16px;width:100%;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-size:13px;color:var(--muted);font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.seg{display:grid;gap:6px}
.seg button{background:var(--bg);color:var(--ink);font-weight:500;padding:10px 6px;text-align:center}
.seg button small{display:block;color:var(--muted);font-size:11px;font-weight:400}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.seg button[aria-pressed=true] small{color:var(--bg);opacity:.75}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;border-radius:999px;padding:7px 14px;background:var(--surface);border:1px solid var(--line);color:var(--ink);font-weight:500}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{display:flex;flex-direction:column}
.item{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 2px;border-bottom:1px solid var(--line);background:none;border-radius:0;color:var(--ink);font-weight:400;text-align:right;width:100%}
.item:last-child{border-bottom:0}
.item .n{font-weight:600;min-width:0;flex:1}
.item .m{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap}
.plus{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-size:20px;font-weight:700;flex:none}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.daybar .d{font-family:var(--display);font-weight:600}
.meal h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:2px}
.del{background:none;color:var(--muted);padding:4px 8px;font-size:18px}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
.ex{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.ex:first-child{border-top:0;margin-top:0;padding-top:0}
.ex a{color:var(--ink);font-weight:600;text-decoration:none}
.ex .last{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sets{display:grid;grid-template-columns:28px 1fr 1fr 40px;gap:6px;align-items:center;margin-top:8px;font-variant-numeric:tabular-nums}
.sets input{padding:8px;text-align:center;font-size:16px}
.sets .h{font-size:11px;color:var(--muted);text-align:center}
.done{width:40px;height:40px;padding:0;border-radius:10px;background:var(--track);color:var(--muted)}
.done[aria-pressed=true]{background:var(--good);color:#fff}
.order{display:flex;gap:6px;flex-wrap:wrap}
.order span{font-size:12px;padding:4px 10px;border-radius:8px;background:var(--bg);color:var(--muted)}
.order span.on{background:var(--ink);color:var(--bg)}
.grid28{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;direction:ltr}
.grid28 i{aspect-ratio:1;border-radius:6px;background:var(--track);max-width:100%}
.grid28 i.f{background:color-mix(in srgb,var(--accent) 45%,var(--track))}
.grid28 i.w{background:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-left:4px;vertical-align:middle}
nav{position:fixed;inset:auto 0 0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;z-index:6;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:480px}
nav button{background:none;color:var(--muted);border-radius:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-current=page]{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20}
.sheet{position:fixed;inset:auto 0 0;z-index:21;background:var(--surface);border-radius:22px 22px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:480px;margin:0 auto;max-height:88vh;overflow-y:auto}
.qty{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:12px 0}
.qty button,.meals button{padding:10px 0;background:var(--bg);color:var(--ink)}
.qty button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.meals{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:12px}
.meals button{font-size:13px;padding:8px 0}
.meals button[aria-pressed=true]{background:var(--accent);color:var(--on-accent)}
.check{display:flex;align-items:center;gap:8px;font-size:14px;margin:10px 0}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;z-index:30;font-weight:600;max-width:calc(100% - 32px);text-align:center}
.bar{height:8px;border-radius:99px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{font-size:12px;color:var(--muted);text-align:center;margin:0}
.install{border:1px dashed var(--accent);background:var(--accent-soft)}
.install ol{margin:6px 0 0;padding-inline-start:20px}
.hero{padding-block:20px 6px}
.hero .brand{font-size:30px;margin-bottom:6px;text-align:right}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.ring circle.v{transition:stroke-dashoffset .6s ease}}
</style>
</head>
<body>
<div class="app">
  <header id="hdr">
    <div class="brand">FORMA</div>
    <div class="hright">
      <div class="streak" title="أيام متتالية سجلت فيها"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5 0 2 1 3 2 3 0-3-1-6 1-9.5z"/></svg><span id="streakN">0</span></div>
      <button class="gear" id="gearB" aria-label="الإعدادات"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg></button>
    </div>
  </header>
  <main id="view" class="stack"></main>
</div>
<nav><div class="in">
  <button data-tab="today"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>اليوم</button>
  <button data-tab="food"><svg viewBox="0 0 24 24"><path d="M5 11h14a7 7 0 0 1-14 0zM9 7c0-2 2-2 2-4M13 7c0-2 2-2 2-4"/></svg>الأكل</button>
  <button data-tab="train"><svg viewBox="0 0 24 24"><path d="M3 10v4M6 8v8M18 8v8M21 10v4M6 12h12"/></svg>التمرين</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24"><path d="M4 19h16M6 16l4-5 3 3 5-7"/></svg>تقدمي</button>
</div></nav>
<script src="foods.js"></script>
<script src="app.js"></script>
</body>
</html>
